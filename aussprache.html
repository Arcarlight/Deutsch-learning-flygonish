        <p class="lead">德语读起来比看起来规矩：拼写和发音的对应关系很稳定。先把字母和几个特别的音认熟，之后看到生词也能大致读出来。每个喇叭都可以点。</p>
        <p class="lead" style="font-size:13.5px;margin-top:8px;color:var(--ink-3)">朗读用的是系统语音合成。如果听不到德语，可以在系统的「语音」设置里装一个德语语音包（Windows：设置 → 时间和语言 → 语言和区域 → 添加德语）。</p>
